name: Hourly data refresh
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build data.json from Sleeper and ESPN
        run: python3 refresh.py site/data.json $(grep -oE '^[0-9]+' leagues.txt | tr '\n' ' ')
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data.json
          git diff --cached --quiet && exit 0
          git commit -m "Hourly data refresh [CF-Pages-Skip]"
          git push
